[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "toolbound"
version = "0.1.0"
description = "Contract-first, secure-by-default REST and Python tools for AI agents: validated input, enforced policy, shaped and budgeted output."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "The Toolbound Authors" }]
keywords = ["ai", "agents", "llm", "tools", "tool-calling", "rest", "api", "security", "ssrf", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
tiktoken = ["tiktoken>=0.7"]

[project.scripts]
toolbound = "toolbound.cli:main"

[project.urls]
Homepage = "https://github.com/SaeedNoshadi89/toolbound"
Documentation = "https://github.com/SaeedNoshadi89/toolbound/tree/main/docs"
Issues = "https://github.com/SaeedNoshadi89/toolbound/issues"
Changelog = "https://github.com/SaeedNoshadi89/toolbound/blob/main/CHANGELOG.md"
Security = "https://github.com/SaeedNoshadi89/toolbound/security/policy"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "ruff>=0.6",
  "pyyaml>=6",
  "types-PyYAML",
  "types-jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolbound"]

[tool.hatch.build.targets.sdist]
include = ["src/toolbound", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "network: requires internet access (skipped unless TOOLBOUND_NETWORK_TESTS=1)",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/toolbound"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tiktoken", "yaml"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT011", "PT018", "RUF001", "E501", "ASYNC251", "N802"]
"benchmarks/**" = ["S", "T201", "E501", "SIM905"]
"examples/**" = ["S", "T201", "E501"]
