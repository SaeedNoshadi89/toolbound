name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    # A release is never built unless the full suite, the security regression
    # suite and the dependency audit pass on the tagged commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
          enable-cache: false # never restore a cache into a release build
      - run: uv sync --locked
      - run: uv run ruff check . && uv run mypy
      - run: uv run pytest
      - run: uv run pytest -m security
      - run: uv export --format requirements-txt --no-hashes --all-groups --no-emit-project > requirements-audit.txt
      - run: uvx pip-audit==2.10.1 -r requirements-audit.txt --no-deps --disable-pip --strict
      - name: Tag matches package version
        run: |
          version=$(uv run python -c "import toolbound; print(toolbound.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
          enable-cache: false # never restore a cache into a release build
      - run: uv build
      - run: uvx twine==7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi # configure required reviewers on this environment
    permissions:
      id-token: write # PyPI trusted publishing; no API token stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
